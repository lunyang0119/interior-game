[project]
name = "interior-server"
version = "0.1.0"
description = "Shared Room Decorator API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2",
    "google-genai>=1.0",   # AI hunters for the train minigame (app/train/bot_player.py); only used when GEMINI_API_KEY is set
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pillow>=10"]  # pillow: tools/preprocess
editor = ["pillow>=10"]  # the VM editor (tools/preprocess/editor.py --vm, deploy/interior-editor.service)

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.train"]

[tool.setuptools.package-data]
"app.train" = ["*.json"]
